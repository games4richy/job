    <style>
        /* Base Reset & Variables */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-gradient: #0a0f1d;
            --card-bg: #ffffff;
            --text-dark: #111827;
            --text-light: #f9fafb;
            --text-muted: #4b5563;
            --canada-red: #dc2626;
            --canada-red-hover: #b91c1c;
            --border-color: #d1d5db;
        }

        body, html {
            height: 100%;
            background: var(--bg-gradient);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* App Container constrained to fit single mobile screen perfectly */
        .app-container {
            width: 100%;
            max-width: 420px;
            height: 100%;
            max-height: 880px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
            color: var(--text-light);
        }

        /* Top Section */
        .header {
            text-align: center;
            padding: 4px 0;
        }

        .flag-icon {
            font-size: 2.2rem;
            line-height: 1;
            margin-bottom: 2px;
            display: block;
        }

        .main-title {
            font-size: 1.75rem;
            font-weight: 900;
            letter-spacing: -0.03em;
            color: #ffffff;
            margin-bottom: 2px;
        }

        .sub-title {
            color: #10b981;
            font-size: 0.9rem;
            font-weight: 600;
            line-height: 1.3;
        }

        /* Middle Section Card */
        .quiz-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            color: var(--text-dark);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .question-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .question-label {
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--text-dark);
            text-transform: uppercase;
            letter-spacing: -0.01em;
        }

        /* Interactive Grid Layouts */
        .btn-grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .btn-grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        /* Form Controls */
        .btn-pill {
            font-size: 0.85rem;
            font-weight: 700;
            padding: 10px;
            border-radius: 30px;
            border: 2px solid var(--border-color);
            background-color: #f9fafb;
            color: var(--text-dark);
            cursor: pointer;
            text-align: center;
            transition: all 0.15s ease;
        }

        .btn-pill.selected {
            background-color: var(--canada-red);
            color: #ffffff;
            border-color: var(--canada-red);
        }

        .btn-pill-small {
            font-size: 0.75rem;
            padding: 8px 4px;
            border-radius: 20px;
        }

        .btn-square {
            font-size: 0.9rem;
            font-weight: 700;
            padding: 10px;
            border-radius: 8px;
            border: 2px solid var(--border-color);
            background-color: #f9fafb;
            color: var(--text-dark);
            cursor: pointer;
            text-align: center;
            transition: all 0.15s ease;
        }

        .btn-square.selected {
            background-color: var(--text-dark);
            color: #ffffff;
            border-color: var(--text-dark);
        }

        /* Trust Strip Section */
        .trust-strip {
            display: flex;
            justify-content: space-between;
            background-color: rgba(0, 0, 0, 0.2);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .trust-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            color: #10b981;
        }

        /* Bottom Action Interface */
        .footer-action {
            width: 100%;
            padding-bottom: 4px;
        }

        .btn-submit {
            width: 100%;
            background-color: var(--canada-red);
            color: #ffffff;
            font-size: 1.15rem;
            font-weight: 900;
            padding: 14px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: background-color 0.15s;
            display: block;
            text-align: center;
            text-decoration: none;
        }

        .btn-submit:active {
            background-color: var(--canada-red-hover);
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <header class="header">
            <span class="flag-icon" aria-label="Canadian Flag">🍁</span>
            <h1 class="main-title">CANADA IS HIRING</h1>
            <p class="sub-title">Visa Sponsorship Included — Foreign Workers Welcome — Apply Free</p>
        </header>

        <main class="quiz-card">
            
            <div class="question-group">
                <label class="question-label">Select your country:</label>
                <div class="btn-grid-2">
                    <button class="btn-pill" onclick="selectCountry(this)">Nigeria 🇳🇬</button>
                    <button class="btn-pill" onclick="selectCountry(this)">Ghana 🇬🇭</button>
                </div>
            </div>

            <div class="question-group">
                <label class="question-label">What type of work are you looking for?</label>
                <div class="btn-grid-3">
                    <button class="btn-pill btn-pill-small" onclick="selectJob(this)">Construction</button>
                    <button class="btn-pill btn-pill-small" onclick="selectJob(this)">Healthcare</button>
                    <button class="btn-pill btn-pill-small" onclick="selectJob(this)">Hospitality</button>
                </div>
                <div class="btn-grid-3">
                    <button class="btn-pill btn-pill-small" onclick="selectJob(this)">Farming</button>
                    <button class="btn-pill btn-pill-small" onclick="selectJob(this)">Driving</button>
                    <button class="btn-pill btn-pill-small" onclick="selectJob(this)">Other</button>
                </div>
            </div>

            <div class="question-group">
                <label class="question-label">Do you have work experience?</label>
                <div class="btn-grid-2">
                    <button class="btn-square" onclick="selectExperience(this)">YES</button>
                    <button class="btn-square" onclick="selectExperience(this)">NO</button>
                </div>
            </div>

        </main>

        <div class="trust-strip">
            <div class="trust-item"><span>✔</span> Visa Included</div>
            <div class="trust-item"><span>✔</span> Free to Apply</div>
            <div class="trust-item"><span>✔</span> Reply in 24hrs</div>
        </div>

        <footer class="footer-action">
            <button class="btn-submit" onclick="processEligibility()">APPLY NOW — FREE</button>
        </footer>

    </div>

    <script>
        // Specific highlighting logic for Country buttons (Highlights Red)
        function selectCountry(element) {
            const row = element.parentElement;
            row.querySelectorAll('.btn-pill').forEach(btn => btn.classList.remove('selected'));
            element.classList.add('selected');
        }

        // Generic selection logic for Job categories
        function selectJob(element) {
            const card = element.closest('.question-group');
            card.querySelectorAll('.btn-pill').forEach(btn => btn.classList.remove('selected'));
            element.classList.add('selected');
        }

        // Generic selection logic for Experience options
        function selectExperience(element) {
            const row = element.parentElement;
            row.querySelectorAll('.btn-square').forEach(btn => btn.classList.remove('selected'));
            element.classList.add('selected');
        }

        // External Link Redirect Trigger
        function processEligibility() {
            window.location.href = "https://job.mathsinsure.com/canada-hiring-foreign-workers-visa-sponsorship";
        }
    </script>
</body>
</html>
