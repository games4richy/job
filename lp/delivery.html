    <title>Move to Canada</title>

    <style>
        /* Base Reset & Variables */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-dark: #0a0f1d;
            --card-bg: #ffffff;
            --text-dark: #0f172a;
            --text-light: #f8fafc;
            --text-muted: #64748b;
            --primary-green: #10b981;
            --primary-red: #ef4444;
            --primary-orange: #f97316;
            --border-color: #cbd5e1;
        }

        body, html {
            height: 100%;
            background-color: var(--bg-dark);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* App Container constrained to single screen mobile view */
        .app-container {
            width: 100%;
            max-width: 420px;
            height: 100%;
            max-height: 850px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
            color: var(--text-light);
        }

        /* Top Section */
        .header {
            text-align: center;
            padding: 8px 0;
        }

        .flag-emoji {
            font-size: 2.5rem;
            line-height: 1;
            margin-bottom: 4px;
            display: block;
        }

        .main-title {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: -0.05em;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .sub-title {
            color: var(--primary-green);
            font-size: 0.95rem;
            font-weight: 700;
            line-height: 1.3;
        }

        /* Middle Section Card */
        .quiz-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            color: var(--text-dark);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .question-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .question-label {
            font-size: 0.9rem;
            font-weight: 800;
            color: var(--text-dark);
            text-transform: uppercase;
            letter-spacing: -0.02em;
        }

        /* Button Grid Layouts */
        .btn-grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .btn-grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        /* Interactive Element Styles */
        .btn-action {
            font-size: 0.85rem;
            font-weight: 700;
            padding: 10px;
            border-radius: 8px;
            border: 2px solid transparent;
            cursor: pointer;
            text-align: center;
            transition: background-color 0.15s, border-color 0.15s;
        }

        /* Specialized Interactive States */
        .btn-green-filled {
            background-color: var(--primary-green);
            color: #ffffff;
        }
        .btn-green-filled.selected {
            background-color: #059669;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.4);
        }

        .btn-outline {
            background-color: transparent;
            border-color: var(--border-color);
            color: var(--text-dark);
        }
        .btn-outline.selected {
            border-color: var(--text-dark);
            background-color: #f1f5f9;
        }

        .btn-pill {
            background-color: #f1f5f9;
            color: var(--text-dark);
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            font-size: 0.8rem;
            padding: 8px 4px;
        }
        .btn-pill.selected {
            background-color: var(--text-dark);
            color: #ffffff;
            border-color: var(--text-dark);
        }

        /* Urgency Bar */
        .urgency-bar {
            background-color: var(--primary-red);
            color: #ffffff;
            font-size: 0.8rem;
            font-weight: 800;
            text-align: center;
            padding: 8px;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }

        /* Bottom Section Elements */
        .footer-action {
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
            padding-bottom: 8px;
            width: 100%;
        }

        .btn-apply {
            width: 100%;
            background-color: var(--primary-orange);
            color: #ffffff;
            font-size: 1.25rem;
            font-weight: 900;
            padding: 14px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            box-shadow: 0 4px 14px rgba(249, 115, 22, 0.4);
            text-decoration: none;
            display: block;
            text-align: center;
        }

        .btn-apply:active {
            background-color: #ea580c;
        }

        .footer-subtext {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <header class="header">
            <span class="flag-emoji" aria-label="Canadian Flag">🍁</span>
            <h1 class="main-title">MOVE TO CANADA</h1>
            <p class="sub-title">Delivery Jobs — Earn $25–$35/hr — No Degree Needed</p>
        </header>

        <main class="quiz-card">
            
            <div class="question-group">
                <label class="question-label">Do you have a driver's license?</label>
                <div class="btn-grid-2">
                    <button class="btn-action btn-green-filled" onclick="selectOption(this, 'q1')">YES</button>
                    <button class="btn-action btn-outline" onclick="selectOption(this, 'q1')">NO</button>
                </div>
            </div>

            <div class="question-group">
                <label class="question-label">Your age range?</label>
                <div class="btn-grid-4">
                    <button class="btn-action btn-pill" onclick="selectOption(this, 'q2')">20–30</button>
                    <button class="btn-action btn-pill" onclick="selectOption(this, 'q2')">31–40</button>
                    <button class="btn-action btn-pill" onclick="selectOption(this, 'q2')">41–45</button>
                    <button class="btn-action btn-pill" onclick="selectOption(this, 'q2')">45+</button>
                </div>
            </div>

            <div class="question-group">
                <label class="question-label">Ready to start within 3 months?</label>
                <div class="btn-grid-2">
                    <button class="btn-action btn-outline" onclick="selectOption(this, 'q3')">YES</button>
                    <button class="btn-action btn-outline" onclick="selectOption(this, 'q3')">NOT SURE</button>
                </div>
            </div>

            <div class="urgency-bar" id="deadline-bar">
                ⚠ Deadline: <span id="deadline-date">Loading...</span> — Slots filling fast
            </div>

        </main>

        <footer class="footer-action">
            <button class="btn-apply" onclick="submitApplication()">APPLY NOW — FREE</button>
            <span class="footer-subtext">Free • No hidden fees • Reply within 24hrs</span>
        </footer>

    </div>

    <script>
        // Set dynamic date parameters (5 days out from contemporary window execution)
        function setUrgencyDeadline() {
            const targetDate = new Date();
            targetDate.setDate(targetDate.getDate() + 5);
            
            const dynamicOptions = { month: 'short', day: 'numeric', year: 'numeric' };
            document.getElementById('deadline-date').textContent = targetDate.toLocaleDateString('en-US', dynamicOptions);
        }

        // Toggle programmatic configuration for individual elements inside grouped components
        function selectOption(element, group) {
            const parentContainer = element.parentElement;
            const operationalButtons = parentContainer.querySelectorAll('.btn-action');
            
            operationalButtons.forEach(btn => btn.classList.remove('selected'));
            element.classList.add('selected');
        }

        // External Link Redirect Trigger
        function submitApplication() {
            window.location.href = "https://job.mathsinsure.com/canada-delivery-jobs-hiring-foreign-workers";
        }

        // Initialize display configuration state
        setUrgencyDeadline();
    </script>
</body>
</html>
